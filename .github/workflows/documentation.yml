name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/documentation.yml'
      - 'documentation/**'
      - 'purpl/**'
      - 'purpl-ui/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: JDK 구성
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Android SDK 플랫폼 설치
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'

      - name: GitHub Pages 구성
        uses: actions/configure-pages@v6

      - name: Dokka 문서 생성
        run: ./gradlew :dokkaGenerate

      - name: 문서 결과 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
